name: Saila release

# Push a tag like v0.1.4-b2 (or run it by hand with a tag) to build signed APKs and publish a
# GitHub release. The app's update check reads releases/latest, so the release is not a prerelease.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   SAILA_KEYSTORE_BASE64   the release .jks file, base64 encoded
#   SAILA_KEYSTORE_PASSWORD store password
#   SAILA_KEY_ALIAS         key alias
#   SAILA_KEY_PASSWORD      key password

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.4-b2 (created on the selected branch if missing)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Check signing secrets
      env:
        KS: ${{ secrets.SAILA_KEYSTORE_BASE64 }}
        KS_PASS: ${{ secrets.SAILA_KEYSTORE_PASSWORD }}
        ALIAS: ${{ secrets.SAILA_KEY_ALIAS }}
        KEY_PASS: ${{ secrets.SAILA_KEY_PASSWORD }}
      run: |
        if [ -z "$KS" ] || [ -z "$KS_PASS" ] || [ -z "$ALIAS" ] || [ -z "$KEY_PASS" ]; then
          echo "::error::Signing secrets are missing. An APK signed with another key cannot update the installed app."
          exit 1
        fi

    - name: Check version matches tag
      run: |
        NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' V2rayNG/app/build.gradle.kts)
        if [ "v$NAME" != "$TAG" ]; then
          echo "::error::versionName $NAME does not match tag $TAG"
          exit 1
        fi

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '/^android {/a\    ndkVersion = "30.0.16248370"' V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: bash compile-hevtun.sh

    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        echo "XRAY_LITE_TAG=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.XRAY_LITE_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Write signing config
      env:
        KS: ${{ secrets.SAILA_KEYSTORE_BASE64 }}
        KS_PASS: ${{ secrets.SAILA_KEYSTORE_PASSWORD }}
        ALIAS: ${{ secrets.SAILA_KEY_ALIAS }}
        KEY_PASS: ${{ secrets.SAILA_KEY_PASSWORD }}
      run: |
        echo "$KS" | base64 -d > "$RUNNER_TEMP/saila.jks"
        {
          echo "storeFile=$RUNNER_TEMP/saila.jks"
          echo "storePassword=$KS_PASS"
          echo "keyAlias=$ALIAS"
          echo "keyPassword=$KEY_PASS"
        } > "$RUNNER_TEMP/keystore.properties"
        echo "SAILA_KEYSTORE_PROPERTIES=$RUNNER_TEMP/keystore.properties" >> $GITHUB_ENV

    - name: Unit tests
      run: |
        cd V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew :app:testPlaystoreDebugUnitTest

    - name: Build APKs
      run: |
        cd V2rayNG
        ./gradlew :app:assemblePlaystoreRelease

    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        NOTES=".github/release-notes/$TAG.md"
        [ -f "$NOTES" ] || { echo "Saila $TAG" > "$RUNNER_TEMP/notes.md"; NOTES="$RUNNER_TEMP/notes.md"; }
        gh release create "$TAG" V2rayNG/app/build/outputs/apk/playstore/release/*.apk \
          --target "$GITHUB_SHA" --title "Saila ${TAG#v}" --notes-file "$NOTES"

    - name: Remove signing files
      if: always()
      run: rm -f "$RUNNER_TEMP/saila.jks" "$RUNNER_TEMP/keystore.properties"
